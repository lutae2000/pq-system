spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:merp-postgresql}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cheil_dev}
    username: ${POSTGRES_USER:cheil}
    password: ${POSTGRES_PASSWORD:cheil}
  batch:
    jdbc:
      initialize-schema: always

batch:
  cleanup:
    api-call-logs:
      enabled: true
      cron: "0 0 3 * * *"
      zone: Asia/Seoul
      retention-months: 3
  g2b:
    bid-notice:
      enabled: true
      run-on-startup: false
      cron: "0 */10 8-23 * * *"
      zone: Asia/Seoul
      page-size: 999
      lookback-minutes: 1440
      region-codes: "00,11"
      request-from: ""
      request-to: ""
      include-unrestricted: true

logging:
  level:
    com.cheil.batch: INFO
