spring:
  data:
    redis:
      host: works-valkey
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:postgresql://${POSTGRES_HOST:works-postgresql}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cheil_dev}
    username: ${POSTGRES_USER:cheil}
    password: ${POSTGRES_PASSWORD:cheil}
  batch:
    jdbc:
      initialize-schema: always

batch:
  cleanup:
    g2b-bid-notices:
      enabled: ${BATCH_G2B_BID_NOTICE_CLEANUP_ENABLED:true}
      cron: "${BATCH_G2B_BID_NOTICE_CLEANUP_CRON:0 30 3 * * *}"
      zone: ${BATCH_G2B_BID_NOTICE_CLEANUP_ZONE:Asia/Seoul}
    api-call-logs:
      enabled: true
      cron: "0 0 3 * * *"
      zone: Asia/Seoul
      retention-months: 3
  g2b:
    bid-notice:
      enabled: false
      run-on-startup: false
      cron: "0 */10 8-22 * * *"
      zone: Asia/Seoul
      lock-ttl: 1m
      page-size: 999
      lookback-minutes: 1440
      region-codes: "00,11"
      request-from: ""
      request-to: ""
      include-unrestricted: true

logging:
  level:
    p6spy: DEBUG

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
