global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cheil-be-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: valkey-exporter
    static_configs:
      - targets:
          - valkey-exporter:9121

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8888
