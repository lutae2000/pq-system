spring:
  datasource:
    # 개발 DB 연결 정보.
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cheil_dev}
    username: ${POSTGRES_USER:cheil}
    password: ${POSTGRES_PASSWORD:cheil}
  jpa:
    # 개발은 스키마를 검증만 하고, 부팅 시 데이터 주입은 하지 않는다.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    SQL_COMPLETED: DEBUG
    com.p6spy: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

management:
  endpoints:
    web:
      # 개발에서만 운영보다 더 많은 관리 정보를 노출한다.
      exposure:
        include: health,info,metrics,prometheus,loggers,threaddump
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    health:
      show-details: always
      show-components: always

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

app:
  security:
    aes256-secret: ${APP_AES256_SECRET:cheil-dev-aes256-secret}
  file:
    # 개발 파일 저장 경로.
    storage-root: ${APP_FILE_STORAGE_ROOT:/data/cheil-be/files/dev}
