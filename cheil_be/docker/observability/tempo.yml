auth_enabled: false

server:
  http_listen_port: 3200

distributor:
  # 긴 SQL(jdbc.query[0])이 Tempo 저장 전에 잘리지 않도록 허용 크기를 늘린다.
  max_attribute_bytes: 65536
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
