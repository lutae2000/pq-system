services:
  prometheus:
    image: 'prom/prometheus:latest'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - '../../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - 'prometheus-data:/prometheus'
    ports:
      - '9090:9090'
    restart: unless-stopped

  loki:
    image: 'grafana/loki:2.9.8'
    command:
      - '-config.file=/etc/loki/loki.yml'
    volumes:
      - '../../docker/observability/loki.yml:/etc/loki/loki.yml:ro'
      - 'loki-data:/loki'
    ports:
      - '3100:3100'
    restart: unless-stopped

  tempo:
    image: 'grafana/tempo:2.10.6'
    command:
      - '-config.file=/etc/tempo/tempo.yml'
    volumes:
      - '../../docker/observability/tempo.yml:/etc/tempo/tempo.yml:ro'
      - 'tempo-data:/var/tempo'
    ports:
      - '3200:3200'
    restart: unless-stopped

  otel-collector:
    image: 'otel/opentelemetry-collector-contrib:0.155.0'
    command:
      - '--config=/etc/otelcol/config.yaml'
    depends_on:
      - tempo
    volumes:
      - '../../docker/observability/otel-collector.yml:/etc/otelcol/config.yaml:ro'
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8888:8888'
      - '13133:13133'
    restart: unless-stopped

  cadvisor:
    image: 'ghcr.io/google/cadvisor:v0.60.3'
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:ro'
      - '/sys:/sys:ro'
      - '/var/lib/docker/:/var/lib/docker:ro'
      - '/dev/disk/:/dev/disk:ro'
    ports:
      - '8081:8080'
    restart: unless-stopped

  redis-exporter:
    image: 'oliver006/redis_exporter:v1.86.0'
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - '9121:9121'
    restart: unless-stopped

  alloy:
    image: 'grafana/alloy:latest'
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '/etc/alloy/config.alloy'
    depends_on:
      - loki
    volumes:
      - '../../docker/observability/alloy-local.alloy:/etc/alloy/config.alloy:ro'
      - '${USERPROFILE}/cheil-be/logs:/workspace/logs:ro'
      - 'alloy-data:/var/lib/alloy'
    restart: unless-stopped

  grafana:
    image: 'grafana/grafana:latest'
    depends_on:
      - prometheus
      - loki
      - tempo
      - otel-collector
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_VIEWERS_CAN_EDIT: 'false'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cheil-be-home-ops.json
    volumes:
      - '../../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro'
      - '../../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro'
      - '../../grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - 'grafana-data:/var/lib/grafana'
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alloy-data:
