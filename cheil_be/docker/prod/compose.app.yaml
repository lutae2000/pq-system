services:
  app-1:
    build: ../../
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cheil_local}
      POSTGRES_USER: ${POSTGRES_USER:-cheil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cheil}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      APP_FILE_STORAGE_ROOT: /data/cheil-be/files/prod
      LOGGING_FILE_NAME: /var/log/cheil-be/app-1.log
    expose:
      - '8080'
    volumes:
      - app-files:/data/cheil-be/files
      - app-logs:/var/log/cheil-be

  app-2:
    build: ../../
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cheil_local}
      POSTGRES_USER: ${POSTGRES_USER:-cheil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cheil}
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      APP_FILE_STORAGE_ROOT: /data/cheil-be/files/prod
      LOGGING_FILE_NAME: /var/log/cheil-be/app-2.log
    expose:
      - '8080'
    volumes:
      - app-files:/data/cheil-be/files
      - app-logs:/var/log/cheil-be

  app-gateway:
    image: 'nginx:1.27-alpine'
    depends_on:
      - app-1
      - app-2
    ports:
      - '8080:8080'
    volumes:
      - '../../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
    restart: unless-stopped

volumes:
  app-files:
  app-logs:
