<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">프론트엔드 공통코드 캐싱 아키텍처</title>
  <desc id="desc">React Query 메모리 캐시와 sessionStorage, 백엔드 Redis와 데이터베이스를 이용한 공통코드 조회 및 갱신 흐름</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="frontend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9f3ff"/>
      <stop offset="100%" stop-color="#d8eaff"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf9f4"/>
      <stop offset="100%" stop-color="#d9f1e7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183b64" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2474c6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#198754"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#718096"/>
    </marker>
    <style>
      .font { font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #5b6b82; }
      .section { font-size: 22px; font-weight: 800; }
      .node-title { font-size: 21px; font-weight: 800; }
      .node-text { font-size: 16px; fill: #53657d; }
      .small { font-size: 14px; fill: #66778d; }
      .label { font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <text x="80" y="78" class="font title">프론트엔드 공통코드 캐싱 아키텍처</text>
  <text x="80" y="114" class="font subtitle">React Query를 중심으로 브라우저 캐시와 백엔드 Redis를 함께 활용하는 조회·갱신 구조</text>

  <rect x="70" y="155" width="920" height="600" rx="24" fill="url(#frontend)" stroke="#a9cbed" stroke-width="2"/>
  <text x="105" y="200" class="font section">Frontend</text>
  <text x="105" y="229" class="font small">화면 간 공통 옵션 재사용 및 새로고침 이후 캐시 복원</text>

  <rect x="112" y="270" width="250" height="150" rx="18" fill="#ffffff" stroke="#8bbbe8" stroke-width="2" filter="url(#shadow)"/>
  <text x="137" y="312" class="font node-title">업무 화면</text>
  <text x="137" y="345" class="font node-text">Select / Autocomplete</text>
  <text x="137" y="373" class="font node-text">Grid 코드명 변환</text>
  <text x="137" y="401" class="font small">useCommonCodeLevel*Options()</text>

  <rect x="423" y="250" width="300" height="190" rx="18" fill="#ffffff" stroke="#4f9be0" stroke-width="3" filter="url(#shadow)"/>
  <text x="452" y="293" class="font node-title">React Query</text>
  <text x="452" y="326" class="font node-text">메모리 캐시</text>
  <text x="452" y="357" class="font node-text">staleTime: 10분</text>
  <text x="452" y="385" class="font node-text">gcTime: 1시간</text>
  <text x="452" y="415" class="font small">queryKey로 조건별 캐시 분리</text>

  <rect x="784" y="250" width="165" height="190" rx="18" fill="#fffdf5" stroke="#e4c76b" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="293" class="font node-title">sessionStorage</text>
  <text x="810" y="329" class="font node-text">새로고침 유지</text>
  <text x="810" y="360" class="font node-text">세션 단위 저장</text>
  <text x="810" y="397" class="font small">공통코드만 영속화</text>

  <path d="M362 345 H413" fill="none" stroke="#2474c6" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="372" y="327" class="font label" fill="#2474c6">조회</text>
  <path d="M723 345 H774" fill="none" stroke="#718096" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <text x="726" y="327" class="font label" fill="#718096">persist</text>

  <rect x="112" y="505" width="837" height="190" rx="18" fill="#ffffff" stroke="#b4cbe2" stroke-width="2"/>
  <text x="140" y="548" class="font node-title">ReferenceQueryCacheProvider</text>
  <text x="140" y="581" class="font node-text">앱 시작 시 sessionStorage → hydrate(queryClient)</text>
  <text x="140" y="612" class="font node-text">query cache 변경 감지 → debounce 후 sessionStorage 저장</text>
  <text x="140" y="650" class="font small">queryKey가 ["references", "common-codes", ...]인 데이터만 저장</text>

  <rect x="1040" y="155" width="490" height="600" rx="24" fill="url(#backend)" stroke="#a8d8c2" stroke-width="2"/>
  <text x="1075" y="200" class="font section">Backend</text>
  <text x="1075" y="229" class="font small">API 요청을 Redis 우선으로 처리하고 DB를 원본으로 유지</text>

  <rect x="1080" y="270" width="190" height="150" rx="18" fill="#ffffff" stroke="#79c29f" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108" y="312" class="font node-title">API</text>
  <text x="1108" y="347" class="font node-text">CommonCodeController</text>
  <text x="1108" y="378" class="font node-text">Reference 조회</text>
  <text x="1108" y="405" class="font small">/code/common-codes</text>

  <rect x="1310" y="250" width="170" height="190" rx="18" fill="#ffffff" stroke="#50a77d" stroke-width="3" filter="url(#shadow)"/>
  <text x="1335" y="293" class="font node-title">Redis</text>
  <text x="1335" y="328" class="font node-text">캐시 적중</text>
  <text x="1335" y="359" class="font node-text">TTL 적용</text>
  <text x="1335" y="397" class="font small">cache:common-codes:*</text>

  <rect x="1080" y="505" width="400" height="150" rx="18" fill="#ffffff" stroke="#9bb5a7" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="547" class="font node-title">Common Code DB</text>
  <text x="1110" y="582" class="font node-text">Redis miss 시 조회하는 원본 데이터</text>
  <text x="1110" y="614" class="font small">조회 성공 후 Redis에 재저장</text>

  <path d="M990 345 H1070" fill="none" stroke="#2474c6" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="1002" y="327" class="font label" fill="#2474c6">HTTP API</text>
  <path d="M1270 345 H1300" fill="none" stroke="#198754" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="1270" y="327" class="font label" fill="#198754">hit</text>
  <path d="M1175 420 V495" fill="none" stroke="#718096" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGray)"/>
  <text x="1192" y="465" class="font label" fill="#718096">miss</text>

  <rect x="70" y="805" width="1460" height="130" rx="22" fill="#ffffff" stroke="#d0dbe8" stroke-width="2"/>
  <text x="105" y="845" class="font node-title">공통코드 수정·삭제 시 갱신 흐름</text>
  <text x="105" y="881" class="font node-text">DB 저장 성공 → 관련 React Query 캐시 invalidate → 활성 화면 재조회 → 최신 결과를 브라우저 캐시에 저장</text>
  <text x="105" y="910" class="font small">로그아웃 시 queryClient.clear()와 sessionStorage 공통코드 캐시를 함께 삭제</text>

  <path d="M1320 505 C1320 720 1000 760 760 760 C530 760 360 720 360 695" fill="none" stroke="#d28a24" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowGray)"/>
  <text x="850" y="740" class="font label" fill="#a96613">캐시 무효화 후 재조회</text>
</svg>
